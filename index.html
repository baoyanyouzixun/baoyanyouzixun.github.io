function todayKey(){
  const d = new Date();
  return d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0")
       + "-" + String(d.getDate()).padStart(2, "0");
}
async function sha256(s){
  const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(s));
  return [...new Uint8Array(buf)].map(b => b.toString(16).padStart(2, "0")).join("");
}
async function unlock(){
  const v = document.getElementById('pc').value.trim().toUpperCase();
  if (!v) return;
  const ph = PASS_TABLE[todayKey()];
  if (!ph){
    document.getElementById('err').textContent = '页面版本过旧，请刷新重进，或看群公告';
    return;
  }
  const h = await sha256(v);
  if (h === ph){
    localStorage.setItem('jl_gate', todayKey() + ":" + h);
    document.getElementById('gate').style.display = 'none';
  } else {
    document.getElementById('err').textContent = '口令不对，去群里看今天的口令（每天 0 点换）';
  }
}
document.getElementById('pc').addEventListener('keydown', e => { if (e.key === 'Enter') unlock(); });
if ((localStorage.getItem('jl_gate') || "").startsWith(todayKey() + ":")){
  document.getElementById('gate').style.display = 'none';
}
let fSub = "全部", fToday = false;
const chips = document.getElementById('chips');
['全部', ...SUBS].forEach(s => {
  const c = document.createElement('span');
  c.className = 'chip' + (s === '全部' ? ' on' : '');
  c.textContent = s;
  c.onclick = () => { fSub = s; document.querySelectorAll('.chip').forEach(x => x.classList.remove('on')); c.classList.add('on'); render(); };
  chips.appendChild(c);
});
document.getElementById('today').onclick = function(){ fToday = !fToday; this.classList.toggle('on'); render(); };
document.getElementById('q').oninput = render;
function left(ts){
  const d = ts - NOW;
  if (d <= 0) return '已到点，速查原文';
  const h = Math.floor(d / 3600000);
  return h >= 24 ? '剩 ' + Math.floor(h/24) + ' 天' : '仅剩 ' + h + ' 小时';
}
function render(){
  const q = document.getElementById('q').value.trim();
  const el = document.getElementById('list');
  const hits = DATA.filter(x =>
    (fSub === '全部' || x.sub === fSub) &&
    (!fToday || x.ts - NOW < 48*3600000) &&
    (!q || (x.sch + x.col + x.proj).includes(q)));
  el.innerHTML = hits.length ? hits.map(x => `
    <div class="card">
      <div class="top"><div><div class="sch">${x.sch}</div><div class="col">${x.col || '—'}</div></div>
      <span class="tag">${x.sub}</span></div>
      <div class="proj">${x.proj}</div>
      <div class="deadline${x.ts - NOW < 24*3600000 ? ' hot' : ''}">⏰ 截止 ${x.dl}<span class="left">${left(x.ts)}</span></div>
      <div class="meta"><span>开始：${x.start || '—'}</span><a href="${x.url}" target="_blank">官方通知原文 →</a></div>
    </div>`).join('') : '<div class="none">没有符合条件的口子，换个筛选试试</div>';
}
render();
